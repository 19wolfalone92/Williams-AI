name: Williams AI v7.2 — strict early EOS suppression contract (NO GPU)
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - williams_ai/v72_eos_guard.py
      - tests/test_williams_ai_v72_eos_gate.py
      - .github/workflows/ai-v72-eos-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-v72-guard-no-weights:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Suppress premature EOS; preserve valid JSON and prevent fabricated abstention
        run: |
          python -m unittest tests.test_williams_ai_v72_eos_gate -v
          python -m py_compile williams_ai/v72_eos_guard.py

name: Williams AI Kaggle PRIVATE upstream kernel attach access diagnostic (NO GPU)

on:
  push:
    branches: [research/actual-qwen3-4b-kaggle-qlora-pilot-20261027]
    paths: ['.github/workflows/ai-kaggle-upstream-access-check.yml']
permissions:
  contents: read
jobs:
  inspect-kaggle-upstream-no-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Distinguish private parent-kernel attachment vs Kaggle quota/validation error by CPU-only stub submissions
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re,subprocess,tempfile
          from pathlib import Path
          from kagglehub.auth import get_username
          u=get_username()
          assert re.fullmatch(r'[A-Za-z0-9_-]{2,62}',u)
          with tempfile.TemporaryDirectory() as td:
              p=Path(td)
              (p/"worker.py").write_text("print('ONLY_PRIVATE_KAGGLE_DRAFT_CREATED_NO_CPU_GPU_EXECUTED')\n")
              for label,parents in [
                   ("no-parent",[]),
                   ("with-parent",[f"{u}/williams-ai-qwen4b-rank8-32steps-20261027"])
              ]:
                  slug="williams-ai-kaggle-link-test-"+label+"-20261027"
                  meta={"id":f"{u}/{slug}","title":slug,"code_file":"worker.py",
                        "language":"python","kernel_type":"script","is_private":"true",
                        "enable_gpu":"false","enable_internet":"false",
                        "dataset_sources":[],"model_sources":[],
                        "competition_sources":[],"kernel_sources":parents}
                  (p/"kernel-metadata.json").write_text(json.dumps(meta))
                  run=subprocess.run(["kaggle","kernels","push","-p",str(p),"--timeout","60"],
                      capture_output=True,text=True,timeout=90)
                  print("PRIVATE_KAGGLE_CPU_STUB_TEST",label,run.returncode,
                        "stdout_len",len(run.stdout),"stderr_len",len(run.stderr))
                  # No secrets in Python or notebook. Filter error strings to prevent
                  # sensitive account attributes being exposed.
                  err=(run.stderr+" "+run.stdout)
                  s=os.environ.get("KAGGLE_API_TOKEN","")
                  if s:err=err.replace(s,"[REDACTED]")
                  print("PRIVATE_KAGGLE_DRAFT_FEEDBACK",label,err[-500:])
          PY

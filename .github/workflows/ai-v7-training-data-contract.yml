name: Williams AI v7 — human-reviewed training data contract (no real gold submitted)
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - williams_ai/v7_training_data_contract.py
      - tests/test_williams_ai_v7_training_data_contract.py
      - .github/workflows/ai-v7-training-data-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-private-data-builder-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install crypto verifier
        run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=41,<47'
      - name: Verify strict split, signature, source, and no-pseudolabel guards
        run: python -m unittest tests.test_williams_ai_v7_training_data_contract -v

name: Williams AI v6 — salvage partial T4 historical100 model answers (NO new GPU)
on:
  push:
    branches: [research/williams-v6-hist100-hybrid-gpu-20261115]
    paths:
      - .github/workflows/ai-v6-hist100-kaggle-salvage-partial.yml
      - scripts/ai_v6_hist100_kaggle_salvage_partial.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-recover-verifiable-incomplete-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax, no GPU scheduling
        run: python -m py_compile scripts/ai_v6_hist100_kaggle_salvage_partial.py
      - name: Install read-only Kaggle client
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'six>=1.16,<2' 'numpy>=2,<3'
      - name: Download only Kaggle terminal ERROR kernel output if exposed
        run: python -m scripts.ai_v6_hist100_kaggle_salvage_partial
      - name: Archive only verifiable PARTIAL raw model answers; never claim complete
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v6-HIST100-GPU-REAL-PARTIAL-NOT-COMPLETE-NO-GOLD
          path: ${{ runner.temp }}/hist100_gpu_verified_PARTIAL_not_complete.json
          if-no-files-found: warn
          retention-days: 30

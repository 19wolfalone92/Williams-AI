name: Williams AI v7 — REAL private T4 guided JSON eight-case format pilot
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - scripts/ai_v7_guided_json_8_h1_worker.py
      - scripts/ai_v7_guided_json_8_h1_submit.py
      - scripts/ai_v7_guided_json_8_h1_monitor.py
      - tests/test_ai_v7_guided_json_8_h1.py
      - .github/workflows/ai-v7-guided-json-eight-real-t4.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: williams-ai-v7-real-8-only-T4-20261115
  cancel-in-progress: false

jobs:
  submit-one-private-T4:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source frozen-eight tests and decoder contract
        run: |
          python -m py_compile scripts/ai_v7_guided_json_8_h1_worker.py scripts/ai_v7_guided_json_8_h1_submit.py scripts/ai_v7_guided_json_8_h1_monitor.py
          python -m unittest tests.test_williams_ai_v7_structured_decoder tests.test_ai_v7_guided_json_8_h1 -v
      - name: Install private Kaggle client
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1' 'six>=1.16,<2'
      - name: Reuse existing private T4 kernel or submit exactly once
        run: python -m scripts.ai_v7_guided_json_8_h1_submit
      - uses: actions/upload-artifact@v4
        with:
          name: Williams-V7-T4-SUBMISSION-OR-REUSE-NOT-RESULTS
          path: ${{runner.temp}}/v7_guided_pilot_submission.json
          if-no-files-found: error

  independent-eight-format-audit:
    needs: submit-one-private-T4
    if: always() && needs.submit-one-private-T4.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          run-id: 43658377350
          repository: 19wolfalone92/Williams-AI
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Williams-v6-HIST100-REAL-GPU-100-BASE-100-V5-COMPLETE-NO-GOLD
          path: baseline_v6
      - name: Install read-only Kaggle client
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1' 'six>=1.16,<2'
      - name: Check existing T4 once and validate paired output only when complete
        id: monitor
        run: python -m scripts.ai_v7_guided_json_8_h1_monitor
      - name: Preserve read-only Kaggle status (also when queued/running)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V7-T4-KERNEL-STATUS-NOT-RESULTS
          path: ${{runner.temp}}/v7_guided_kernel_status.json
          if-no-files-found: warn
          retention-days: 45
      - name: Upload genuine paired v7 answers and same-prompt v6 comparison
        if: steps.monitor.outputs.state == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V7-T4-REAL-GUIDED-8-vs-V6-RAW-NO-GOLD
          path: |
            ${{runner.temp}}/v7_GUIDED_REAL_8_MODEL_ANSWERS.json
            ${{runner.temp}}/v7_VS_V6_IDENTICAL_EIGHT_PROMPTS_NO_GOLD.json
          if-no-files-found: error
          retention-days: 45

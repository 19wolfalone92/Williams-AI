name: Williams AI deep QLoRA private GPU readiness (no GPU submission)
on:
  push:
    branches: [research/deep-corrective-20261110]
    paths: ['experiments/deep-gpu-probe-start-20261110.json']
permissions:
  contents: read
concurrency:
  group: williams-ai-deep-gpu-probe-20261110
  cancel-in-progress: false
jobs:
  read-only-kaggle-quota-and-private-parent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Inspect quota, pinned parent artifact and local decrypted source metadata only
        run: python scripts/ai_deep_gpu_probe_20261110.py

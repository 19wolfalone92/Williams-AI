name: Williams AI read-only diagnose private Kaggle T4 kernel failure

on:
  push:
    branches: [kaggle/private-gpu-probe-20261027]
    paths: ['.github/workflows/ai-kaggle-gpu-probe-diagnose.yml']

permissions:
  contents: read

jobs:
  diagnose-own-private-compute-only-worker:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0,<2'
      - name: Read only worker logs, redact secret, perform NO new GPU job
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          kernel="wolf19loner92/williams-ai-gpu-sanity-20261027"
          secret=os.environ.get("KAGGLE_API_TOKEN","")
          for kind,command in [
              ("GPU_KERNEL_STATUS",["kaggle","kernels","status",kernel]),
              ("GPU_KERNEL_OWN_FILES",["kaggle","kernels","files",kernel]),
          ]:
              try:
                  p=subprocess.run(command,capture_output=True,text=True,timeout=65)
                  combined=(p.stdout+"\n"+p.stderr)
                  if secret: combined=combined.replace(secret,"[REDACTED]")
                  print(kind, "returncode",p.returncode)
                  # Compute-only smoke worker does not use any private datasets,
                  # models, Binance keys or original-book material.
                  print(combined[-3800:])
              except subprocess.TimeoutExpired:
                  print(kind,"REQUEST_TIMEOUT")

          from pathlib import Path
          from tempfile import TemporaryDirectory
          with TemporaryDirectory() as tmp:
              r=subprocess.run(["kaggle","kernels","output",kernel,"-p",tmp],
                  capture_output=True,text=True,timeout=90)
              print("GPU_KERNEL_OUTPUT",r.returncode)
              if r.returncode:
                  print((r.stderr or "")[-1800:].replace(secret,"[REDACTED]") if secret else (r.stderr or "")[-1800:])
              files=list(Path(tmp).rglob("*"))
              print("GPU_KERNEL_OUTPUT_FILES",[x.name for x in files if x.is_file()][:40])
              for file in files:
                  if file.is_file() and file.suffix.lower() in (".log",".txt",".json"):
                      try:
                          raw=file.read_text(errors="replace")
                          if secret: raw=raw.replace(secret,"[REDACTED]")
                          print("GPU_KERNEL_RECEIPT",file.name,raw[-2800:])
                      except OSError:
                          pass

          with TemporaryDirectory() as tmp:
              r=subprocess.run(["kaggle","kernels","pull",kernel,"-p",tmp,"-m"],
                  capture_output=True,text=True,timeout=70)
              print("GPU_KERNEL_PULL_REMOTE_CONFIG",r.returncode)
              p=Path(tmp)/"kernel-metadata.json"
              if p.is_file():
                  obj=__import__("json").loads(p.read_text())
                  print("ACTUAL_REMOTE_KAGGLE_ACCELERATOR_METADATA",{
                      key:obj.get(key) for key in ("id","is_private","enable_gpu",
                                                   "machine_shape","enable_internet")})
              else:
                  print("GPU_KERNEL_REMOTE_METADATA_NOT_RETURNED")
          PY

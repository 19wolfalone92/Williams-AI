name: Williams AI diagnose failed private Kaggle kernel and verify account access
on:
  push:
    branches: [research/williams-ai-source-sft-v6-20261124]
    paths:
      - .github/workflows/ai-kaggle-kernel-diagnostic.yml
      - scripts/ai_kaggle_kernel_diagnostic.py
      - tests/test_ai_kaggle_kernel_diagnostic.py
permissions:
  contents: read
  actions: read
concurrency:
  group: williams-ai-kaggle-kernel-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle API and authenticated artifact dependency
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'cryptography>=44,<48' 'six>=1.16,<2' 'numpy>=2,<3' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1'
      - name: Test log redaction
        run: python -m unittest tests.test_ai_kaggle_kernel_diagnostic -v
      - name: Retrieve failed kernel diagnostics and check optional second account
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKEN_2: ${{ secrets.KAGGLE_API_TOKEN_2 }}
        run: |
          python -m scripts.ai_kaggle_kernel_diagnostic --output-dir "$RUNNER_TEMP/kaggle-diagnostic"
      - name: Upload encrypted private diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: williams-ai-kaggle-kernel-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/kaggle-diagnostic/kaggle-kernel-diagnostic.json.sealed
          if-no-files-found: error
          retention-days: 7

name: Williams AI verify private Qwen4B adapter Kaggle dataset after indexing

on:
  push:
    branches: [research/actual-qwen3-4b-kaggle-qlora-pilot-20261027]
    paths: ['.github/workflows/ai-kaggle-qwen4b-dataset-readiness.yml']

permissions: {contents: read}
jobs:
  verify-existing-private-dataset-no-GPU:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0,<2'
      - name: Check created private dataset availability without retraining or cloud writes
        run: |
          python - <<'PY'
          import subprocess,time,os,sys
          slug="wolf19loner92/williams-ai-qwen4b-rank8-research-20261027"
          for attempt in range(1,6):
              a=subprocess.run(["kaggle","datasets","status",slug],
                  capture_output=True,text=True,timeout=35)
              b=subprocess.run(["kaggle","datasets","files",slug,"--csv"],
                  capture_output=True,text=True,timeout=35)
              print("PRIVATE_QWEN4B_DATASET_READINESS",attempt,
                    "status_code",a.returncode,"files_code",b.returncode,
                    "contains_zip","Qwen3-4B_rank8_PUBLIC_BOOK_RULE_ADAPTER.zip" in b.stdout)
              if a.returncode==0:
                  print("PRIVATE_DATASET_STATE",a.stdout[-300:])
              if b.returncode==0 and "Qwen3-4B_rank8_PUBLIC_BOOK_RULE_ADAPTER.zip" in b.stdout:
                  print("PRIVATE_QWEN4B_ADAPTER_DATASET_READY_FOR_KAGGLE_GPU_EVAL")
                  sys.exit(0)
              if attempt==5:
                  print("PRIVATE_KAGGLE_DATASET_NOT_YET_READY")
                  print("SANITIZED_ERROR",a.stderr[-250:],b.stderr[-250:])
                  sys.exit(5)
              time.sleep(7)
          PY

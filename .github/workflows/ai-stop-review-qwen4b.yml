name: Williams AI actual Qwen4B stop and campaign diagnostic

on:
  push:
    branches: [feature/ai-grounded-stop-review-20261025]
    paths:
      - '.github/workflows/ai-stop-review-qwen4b.yml'
      - 'williams_ai/stop_review.py'
      - 'williams_ai/local_model.py'
      - 'williams_ai/reasoning_trial.py'
      - 'williams_ai/tc2_trade_lifecycle_coach.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen4b-stop-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-qwen4b-stop-and-paper-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/williams_stop_qwen4b
      GGUF_SHA256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Causal campaign and stop handoff regressions
        run: python -m unittest discover -s tests -p 'test_williams_ai_stop_review.py' -v
      - name: Install local CPU inference
        run: |
          python -m pip install --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python 'huggingface_hub>=0.29,<2'
      - name: Download and verify pinned official 4B weights
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          import os
          path = Path(hf_hub_download(repo_id='Qwen/Qwen3-4B-GGUF',
              revision='bc640142c66e1fdd12af0bd68f40445458f3869b',
              filename='Qwen3-4B-Q4_K_M.gguf',local_dir='/tmp/williams_stop_4b_model'))
          print(actual_gguf_sha256(path,os.environ['GGUF_SHA256']))
          PY
      - name: Same ten fixed synthetic cases and six worked examples as 1.7B
        run: |
          set -o pipefail
          python -m williams_ai.stop_review \
            --model /tmp/williams_stop_4b_model/Qwen3-4B-Q4_K_M.gguf \
            --expected-sha256 "$GGUF_SHA256" --ctx 8192 --reasoning-budget 1536 \
            | tee /tmp/actual_qwen4b_numeric_stop_review.json
      - name: Same real closed prices and hypothetical paper campaign as 1.7B
        run: |
          python - <<'PY'
          from pathlib import Path
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          from williams_ai.local_model import LocalWilliamsModel
          from williams_ai.causal_paper_lab import frozen_markets
          from williams_ai.reasoning_trial import evaluate_historical_thought
          import json, os
          path = Path('/tmp/williams_stop_4b_model/Qwen3-4B-Q4_K_M.gguf')
          actual_gguf_sha256(path,os.environ['GGUF_SHA256'])
          model = LocalWilliamsModel(path,n_ctx=8192,use_decision_schema=True,
              learning_mode='auto',reasoning_budget=1536)
          market = frozen_markets()['ETHUSDT']
          bars = market['bars']
          cutoff = bars[299]['close_time']
          opened = bars[250]['close_time']
          journal = {'symbol':'ETHUSDT','edition':'TC2','as_of':cutoff,'events':[
              {'at':opened,'type':'OPEN_FILL','side':'LONG',
               'price':float(bars[250]['close']),'exchange_confirmed':True},
              {'at':opened,'type':'STOP_ACK',
               'stop_price':round(float(bars[250]['close'])/2,2),'exchange_confirmed':True}]}
          # Hypothetical PAPER claims are never signed exchange evidence.
          report = {'mode':'ACTUAL_GGUF_REAL_CLOSED_PRICES_WITH_HYPOTHETICAL_PAPER_CAMPAIGN',
              'model_sha256':os.environ['GGUF_SHA256'],'source_commit':os.environ['GITHUB_SHA'],
              'journal_is_synthetic_paper_assumption':True,'signed_broker_data_used':False,
              'untouched_market_holdout':False,'market_profitability_proven':False,
              'model_weights_updated':False,'execution_allowed':False,'trade_action':None}
          try:
              report['reasoning'] = evaluate_historical_thought('ETHUSDT',bars,
                  tick_size=market['tick_size'],bar_index=299,model=model,
                  campaign_journal=journal,include_topdown=False)
              report['pipeline_error'] = None
          except (ValueError,RuntimeError,TypeError,KeyError):
              report['reasoning'] = None
              report['pipeline_error'] = 'MODEL_OR_PIPELINE_FAILED_NO_FAKE_SAFE_ANSWER'
          output = json.dumps(report,ensure_ascii=False,indent=2)
          Path('/tmp/actual_qwen4b_paper_campaign_stop.json').write_text(output,encoding='utf-8')
          print(output)
          PY
      - name: Retain diagnostic only, no weights or private journals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-qwen4b-stop-not-market-performance
          path: |
            /tmp/actual_qwen4b_numeric_stop_review.json
            /tmp/actual_qwen4b_paper_campaign_stop.json
          retention-days: 7
          if-no-files-found: warn

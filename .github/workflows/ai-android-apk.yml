name: Williams AI offline Android APK

on:
  push:
    branches: [feature/read-only-ai-analyst]
    paths:
      - "mobile/**"
      - ".github/workflows/ai-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-ai-android
  cancel-in-progress: true

jobs:
  offline-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout independent Williams AI
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android 36, NDK 29, CMake 3.31.6
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" \
            "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Build standalone native GGUF APK
        shell: bash
        run: bash mobile/build_offline_android.sh
      - name: Upload debug APK and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: WilliamsAI-offline-debug
          path: |
            mobile/out/WilliamsAI-offline-debug.apk
            mobile/out/WilliamsAI-offline-debug.sha256
          retention-days: 14
          if-no-files-found: error

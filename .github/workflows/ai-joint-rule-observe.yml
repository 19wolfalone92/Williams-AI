name: Williams AI observe current private corrective training
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['.github/workflows/ai-joint-rule-observe.yml']
permissions: {contents: read}
jobs:
  observe-existing-private-joint-trainer-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WILLIAMS_OBSERVE_SLUG: williams-ai-joint-rules-20261106
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'six>=1.16,<2'
      - name: Read numerical progress only; do not submit or alter a kernel
        run: python scripts/ai_observe_own_training.py

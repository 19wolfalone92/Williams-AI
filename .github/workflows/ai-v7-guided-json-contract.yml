name: Williams AI v7 — guided JSON decoder isolated contract (no model run)
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - williams_ai/v7_structured_decoder.py
      - tests/test_williams_ai_v7_structured_decoder.py
      - .github/workflows/ai-v7-guided-json-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-guided-decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run safety and malformed-output tests
        run: python -m unittest tests.test_williams_ai_v7_structured_decoder -v
      - name: Verify pinned external JSON parser integration on CPU
        run: |
          python -m pip install --disable-pip-version-check 'lm-format-enforcer==0.11.3'
          python - <<'PY'
          from lmformatenforcer import JsonSchemaParser
          from williams_ai.v7_structured_decoder import schema
          for kind in ("ENTRY","EXIT","WAVE"):
              x=JsonSchemaParser(schema(kind))
              assert "{" in x.get_allowed_characters()
              print("V7_PINNED_JSON_GRAMMAR_READY",kind)
          PY

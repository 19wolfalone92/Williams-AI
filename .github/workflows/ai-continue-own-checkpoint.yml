name: Williams AI continue verified own checkpoint416 and test generated answers
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['.github/workflows/ai-continue-own-checkpoint.yml']
permissions: {contents: read}
concurrency:
  group: williams-private-checkpoint416-20261027
  cancel-in-progress: false
jobs:
  verified-own-partial-checkpoint-continuation:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'numpy>=2,<3' 'safetensors==0.6.2'
      - name: Check recovered-checkpoint admission, private worker and authored curriculum
        run: python -m unittest discover -s tests -p 'test_williams_ai_recovered_training.py' -v
      - name: Continue only verified own416 weights; no optimizer-resume claim; grade sealed answers on CPU
        run: python scripts/ai_continue_own_checkpoint_kaggle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Williams_AI_Qwen3_4B_RECOVERED_416_COURSE_STRUCTURED_TRAINING
          path: ${{ runner.temp }}/recovered_checkpoint_continued_results/
          if-no-files-found: warn
          retention-days: 14

name: Williams AI private Kaggle GPU QLoRA (manual opt-in)

on:
  workflow_dispatch:
    inputs:
      kernel_id:
        description: 'Your Kaggle username/private-kernel-slug'
        required: true
        type: string
      dataset_source:
        description: 'Pre-attached approved PRIVATE Kaggle dataset owner/slug'
        required: true
        type: string
      model_source:
        description: 'Your Kaggle model owner/slug/framework/variation/version'
        required: true
        type: string
      dataset_file:
        description: 'Exact /kaggle/input/.../reviewed.jsonl path'
        required: true
        type: string
      model_directory:
        description: 'Exact /kaggle/input/... HF safetensors model dir'
        required: true
        type: string
      approve_cloud_use:
        description: 'I have rights to process these inputs privately on Kaggle'
        required: true
        type: boolean
        default: false
      launch_gpu:
        description: 'Run paid/quota-limited GPU now? false = publish private draft only'
        required: true
        type: boolean
        default: false
      training_revision:
        description: 'Exact training commit SHA; for resume reuse the original session SHA'
        required: false
        type: string
        default: ''
      resume_config:
        description: 'Optional JSON: dataset_source, directory, trusted_own=true (your private V2 checkpoint)'
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  private-kaggle-bridge:
    if: ${{ inputs.approve_cloud_use == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require manually configured Kaggle token
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo 'KAGGLE_API_TOKEN secret missing; no Kaggle job submitted.' >&2
            exit 1
          fi
      - name: Prepare private job without copying training data into GitHub
        shell: bash
        env:
          KERNEL_ID: ${{ inputs.kernel_id }}
          DATASET_SOURCE: ${{ inputs.dataset_source }}
          MODEL_SOURCE: ${{ inputs.model_source }}
          DATASET_FILE: ${{ inputs.dataset_file }}
          MODEL_DIRECTORY: ${{ inputs.model_directory }}
          TRAINING_REVISION: ${{ inputs.training_revision || github.sha }}
          RESUME_CONFIG: ${{ inputs.resume_config || '{}' }}
        run: |
          python scripts/ai_private_kaggle_gpu_bridge.py \
            --kernel-id "$KERNEL_ID" \
            --dataset-source "$DATASET_SOURCE" \
            --model-source "$MODEL_SOURCE" \
            --dataset-file "$DATASET_FILE" \
            --model-directory "$MODEL_DIRECTORY" \
            --revision "$TRAINING_REVISION" \
            --resume-config "$RESUME_CONFIG" \
            --output "$RUNNER_TEMP/kaggle-private-williams"
      - name: Install official Kaggle CLI on CPU GitHub runner
        run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0'
      - name: Publish private draft without GPU consumption
        if: ${{ inputs.launch_gpu != true }}
        run: kaggle kernels push -p "$RUNNER_TEMP/kaggle-private-williams" --no-run
      - name: Submit private T4 GPU training
        if: ${{ inputs.launch_gpu == true }}
        run: kaggle kernels push -p "$RUNNER_TEMP/kaggle-private-williams" --accelerator NvidiaTeslaT4 --timeout 3600

name: Williams AI v6 source-grounded read-only reasoning (CPU)
on:
  push:
    branches: [research/williams-ai-curriculum-v5-20261111]
    paths:
      - 'williams_ai/v6_research_pipeline.py'
      - 'tests/test_williams_ai_v6_research_pipeline.py'
      - 'research/williams_v6_source_rule_proposals_20261113.json'
      - '.github/workflows/ai-v6-readonly-reasoning-cpu.yml'
  pull_request:
    paths:
      - 'williams_ai/v6_research_pipeline.py'
      - 'tests/test_williams_ai_v6_research_pipeline.py'
      - 'research/williams_v6_source_rule_proposals_20261113.json'
      - '.github/workflows/ai-v6-readonly-reasoning-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-v6-reasoning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secure-rag-and-causal-critic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research-only pipeline and adversarial tests
        run: python -m py_compile williams_ai/v6_research_pipeline.py tests/test_williams_ai_v6_research_pipeline.py
      - name: Execute bounded, offline research integration tests
        run: python -m unittest tests.test_williams_ai_v6_research_pipeline -v

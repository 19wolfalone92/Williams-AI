name: Williams AI actual Qwen historical charts 4-books plus withheld future

on:
  push:
    branches:
      - feature/real-gguf-expanded-historical-20261023

permissions:
  contents: read

jobs:
  real-expanded-source-and-direction-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/williams_ai_historical_exam_hf
      GGUF_FILE: Qwen3-1.7B-Q4_K_M.gguf
      GGUF_SHA256: dbc27452971c440c0b94483fe6c101cf950ea50af6bcafe1282353c3886e6366
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all historical and independent guard tests
        run: python -m unittest discover -s tests -p 'test_williams_ai_*.py' -q
      - name: Install real local CPU llama.cpp and weight download module
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python 'huggingface_hub>=0.29,<2'
      - name: Fetch and independently verify real published Qwen 1.7B GGUF
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          import os
          model=Path(hf_hub_download(
              repo_id="unsloth/Qwen3-1.7B-GGUF",
              revision="b2d17796e6fd93c353a0415a3abd8b7f801701de",
              filename=os.environ["GGUF_FILE"],
              local_dir="/tmp/williams_ai_extended_exam_weights",
          ))
          print("REAL_QWEN_1_7B_VERIFIED",
                actual_gguf_sha256(model,os.environ["GGUF_SHA256"]))
          PY
      - name: REAL Qwen 16 source-specific Williams chart cases and 15 withheld-future cases
        shell: bash
        run: |
          set -euo pipefail
          python -m williams_ai.real_gguf_expanded_history_exam \
            --model "/tmp/williams_ai_extended_exam_weights/${GGUF_FILE}" \
            --expected-sha256 "${GGUF_SHA256}" \
            --code-id "${GITHUB_SHA}" \
            --ctx 8192 | tee /tmp/williams_ai_expanded_exam_redacted.log
      - name: Upload exact-model research audit including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-real-gguf-16-book-15-direction
          path: /tmp/williams_ai_expanded_exam_redacted.log
          if-no-files-found: ignore
          retention-days: 7

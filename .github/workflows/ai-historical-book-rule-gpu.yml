name: Williams AI real historical candles plus original books GPU pilot
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['experiments/historical-rule-training-start.json']
permissions: {contents: read}
concurrency:
  group: williams-ai-historical-book-rules-20261029
  cancel-in-progress: false
jobs:
  actual-history-original-books-free-dual-t4:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'numpy>=2,<3' 'safetensors==0.6.2'
      - name: Verify causal historical examples and real GPU protocol
        run: python -m unittest discover -s tests -p 'test_williams_ai_historical_rule*.py' -v
      - name: Train Qwen3-4B with past candles and original train pages
        run: python scripts/ai_run_historical_rule_kaggle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Williams_AI_Historical_Book_Rule_20261029_Research
          path: ${{ runner.temp }}/historical_rule_results/
          if-no-files-found: warn
          retention-days: 14

name: Williams AI v5 Kaggle forensic diagnosis (no GPU)
on:
  push:
    branches: [research/williams-ai-curriculum-v5-20261111]
    paths: ['.github/workflows/ai-v5-kaggle-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose-previous-kaggle-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle client
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1' 'six>=1.16,<2' 'numpy>=2,<3'
      - name: Inspect old worker without submitting any GPU job
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglehub.auth import get_username
          api=KaggleApi();api.authenticate()
          kernel=get_username()+"/williams-ai-v5-book-sft-20261111"
          state=api.kernels_status(kernel)
          print("FORENSIC_PREVIOUS_GPU_STATE",state.status,flush=True)
          r=subprocess.run(["kaggle","kernels","logs",kernel],capture_output=True,text=True,timeout=120)
          data=r.stdout+"\n"+r.stderr
          print("FORENSIC_LOG_COMMAND_EXIT",r.returncode,flush=True)
          print("FORENSIC_LOG_LINE_COUNT",len(data.splitlines()),flush=True)
          import json
          records=[]
          for raw in r.stdout.splitlines():
              try:
                  item=json.loads(raw.strip().lstrip(",").strip())
                  if isinstance(item,dict) and isinstance(item.get("data"),str): records.append(item)
              except (ValueError, TypeError):
                  continue
          print("FORENSIC_PARSED_RECORDS",len(records),flush=True)
          chunks=[str(x.get("data","")) for x in records]
          if not chunks:
              chunks=[r.stdout]
          raw_lines="\n".join(chunks).splitlines()
          pattern=re.compile(r"(Traceback|Error|Exception|FAILED|Killed|OOM|out of memory|cuda|not found|No module named|No such file|missing|failed|fatal|signal|step|progress|WILLIAMS_V5)",re.I)
          selected=[line.strip() for line in raw_lines if pattern.search(line)]
          print("FORENSIC_PARSED_LOG_LINE_COUNT",len(raw_lines),flush=True)
          for line in selected[-75:]:
              line=re.sub(r"https?://\S+","[URL]",line)
              line=re.sub(r"[A-Za-z0-9_\-]{36,}","[REDACTED]",line)
              line=re.sub(r"\S+@\S+","[REDACTED_EMAIL]",line)
              print("FORENSIC_LOG",line[:500],flush=True)
          if not selected:
              print("FORENSIC_SELECTED_LOGS_NONE",flush=True)
              for line in raw_lines[-12:]: print("FORENSIC_LOG_TAIL",re.sub(r"https?://\S+","[URL]",line.strip())[:250],flush=True)
          if not data.strip(): print("FORENSIC_LOG_EMPTY",flush=True)
          if r.returncode: raise RuntimeError("KAGGLE_LOG_FETCH_FAILED_NO_DIAGNOSIS")
          import tempfile
          from pathlib import Path
          print("FORENSIC_RECORDED_MODEL_SHA",next((m.group(1) for line in raw_lines if (m:=re.search(r'"adapter_sha256"\\s*:\\s*"([a-f0-9]{64})"',line))),"UNAVAILABLE"),flush=True)
          files=subprocess.run(["kaggle","kernels","files",kernel],capture_output=True,text=True,timeout=90)
          print("FORENSIC_FILES_COMMAND_EXIT",files.returncode,flush=True)
          for line in files.stdout.splitlines()[-35:]:
              if "http" in line.lower(): continue
              print("FORENSIC_REMOTE_FILE",line[:200],flush=True)
          with tempfile.TemporaryDirectory() as wd:
              result=subprocess.run(["kaggle","kernels","output",kernel,"-p",wd,"-o"],capture_output=True,text=True,timeout=120)
              print("FORENSIC_DOWNLOAD_EXIT",result.returncode,flush=True)
              print("FORENSIC_DOWNLOAD_FILE_COUNT",len([x for x in Path(wd).rglob("*") if x.is_file()]),flush=True)
              for file in list(Path(wd).rglob("*"))[:100]:
                  if file.is_file():
                      print("FORENSIC_DOWNLOAD_FILE",str(file.relative_to(wd))[:150],"BYTES",file.stat().st_size,flush=True)
              for line in result.stdout.splitlines()[-12:]:
                  print("FORENSIC_DOWNLOAD_MESSAGE",re.sub(r"https?://\\S+","[URL]",line.strip())[:180],flush=True)
          
          PY

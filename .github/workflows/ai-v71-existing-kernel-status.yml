name: Williams AI v7.1 — one-shot existing private T4 status and result verification
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - scripts/ai_v71_existing_kernel_status.py
      - .github/workflows/ai-v71-existing-kernel-status.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read-only-status-and-paired-result:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable original v6 GPU baseline
        uses: actions/download-artifact@v4
        with:
          repository: 19wolfalone92/Williams-AI
          run-id: 43658377350
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: Williams-v6-HIST100-REAL-GPU-100-BASE-100-V5-COMPLETE-NO-GOLD
          path: baseline_v6
      - name: Check existing private Kaggle kernel only; do not submit
        run: |
          python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1' 'six>=1.16,<2'
          python -m scripts.ai_v71_existing_kernel_status
      - name: Preserve existing-kernel status and paired results if complete
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v71-existing-private-T4-status-and-results-NO-GOLD
          path: |
            ${{runner.temp}}/v71_existing_kernel_status.json
            ${{runner.temp}}/v71_patched_lmfe_8_actual_answers_NO_GOLD.json
            ${{runner.temp}}/v71_same_8_inputs_vs_v6_NO_GOLD.json
          if-no-files-found: error
          retention-days: 45

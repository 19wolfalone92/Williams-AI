name: Williams AI recovered V6 vs V5 vs BASE development comparison (no training)
on:
  push:
    branches: [research/williams-ai-source-sft-v6-20261124]
    paths: ['.github/workflows/ai-v6-recovered-development-comparison.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: williams-v6-recovered-development-comparison
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/williams-v5-research-hf
      TOKENIZERS_PARALLELISM: 'false'
      GGUF_FILE: Qwen3-4B-Q4_K_M.gguf
      BASE_SHA256: f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check diagnostic contracts
        run: |
          python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48'
          python -m unittest discover -s tests -p test_williams_ai_v5_objective_diagnostic.py -v
      - name: Download already strictly verified encrypted adapter (no Kaggle submission)
        uses: actions/download-artifact@v4
        with:
          name: Williams-v5-strict-recovery-45406594397-1
          run-id: 45406594397
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-sealed-input
      - name: Authenticate sealed input in private runner memory
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from scripts.ai_submit_v5_qlora_kaggle import DOMAIN
          from scripts.v5_recovery_integrity import verify_recovered_identity
          root=Path(os.environ["RUNNER_TEMP"])
          source=root/"verified-sealed-input"
          sealed,=source.rglob("williams-v5-trained-qwen3-4b-lora.zip.sealed")
          audit,=source.rglob("v5_training_audit.json")
          data=sealed.read_bytes()
          assert sha256(data).hexdigest()==json.loads(audit.read_text())["sha256_encrypted_archive"]
          prefix=b"WILLIAMSV5A1"
          assert data.startswith(prefix)
          offset=len(prefix)
          key=HKDF(algorithm=hashes.SHA256(),length=32,
            salt=data[offset:offset+16],info=DOMAIN).derive(os.environ["KAGGLE_API_TOKEN"].encode())
          clear=AESGCM(key).decrypt(data[offset+16:offset+28],data[offset+28:],DOMAIN)
          dest=root/"williams_v5_private_runtime"
          dest.mkdir(mode=0o700,exist_ok=False)
          with ZipFile(io.BytesIO(clear)) as archive:
              names=("training_receipt.json","adapter_model.safetensors","adapter_config.json")
              for name in names:
                  path=dest/name
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                  with os.fdopen(fd,"wb") as stream: stream.write(archive.read(name))
          print("REUSED_STRICT_ADAPTER",json.dumps(verify_recovered_identity(*(dest/n for n in names))),flush=True)
          PY
      - name: Download authenticated V6 recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: williams-v6-failed-run-recovery-encrypted
          run-id: 45480042116
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-v6-sealed
      - name: Verify and extract only recovered V6 adapter in private runner
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import io, os, json
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from scripts.ai_submit_v5_qlora_kaggle import DOMAIN
          from scripts.v5_recovery_integrity import validate_tensor_bytes
          root=Path(os.environ["RUNNER_TEMP"])
          sealed,=(root/"verified-v6-sealed").rglob("*.sealed")
          raw=sealed.read_bytes()
          assert sha256(raw).hexdigest()=="fa026c401c8ea89bcea119fac153d30bf1004874fe16c81cb8de761a852f03e2"
          magic=b"WILLIAMSV5A1"
          assert raw.startswith(magic)
          n=len(magic)
          key=HKDF(algorithm=hashes.SHA256(),length=32,salt=raw[n:n+16],info=DOMAIN).derive(os.environ["KAGGLE_API_TOKEN"].encode())
          clear=AESGCM(key).decrypt(raw[n+16:n+28],raw[n+28:],DOMAIN)
          dest=root/"williams_v6_private_runtime"
          dest.mkdir(mode=0o700,exist_ok=False)
          with ZipFile(io.BytesIO(clear)) as z:
              prefix="output/williams_v6_objective_smoke/second/"
              weight=z.read(prefix+"latest_adapter/adapter_model.safetensors")
              assert sha256(weight).hexdigest()=="f4979cf0bebbf33b7c8e5746326c1e43762f31fe730e89cf5e39c7a8a155c309"
              assert validate_tensor_bytes(weight)==288
              cfg=z.read(prefix+"latest_adapter/adapter_config.json")
              receipt=json.loads(z.read(prefix+"research_result.json"))
              assert receipt["total_optimizer_steps"]==20 and receipt["optimizer_skips_in_this_session"]==0
              assert receipt["latest_adapter_files"]["adapter_model.safetensors"]==sha256(weight).hexdigest()
              for name,data in (("adapter_model.safetensors",weight),("adapter_config.json",cfg)):
                  fd=os.open(dest/name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                  with os.fdopen(fd,"wb") as out: out.write(data)
          print("V6_RECOVERED_ADAPTER_BYTES_VERIFIED",sha256(weight).hexdigest(),flush=True)
          PY
      - name: Install local CPU GGUF LoRA converter (runner only)
        run: |
          python -m pip install --disable-pip-version-check --index-url \
            https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check \
            'huggingface_hub>=0.29,<2' 'transformers>=4.57,<5' \
            'gguf>=0.17' 'safetensors>=0.5' 'sentencepiece>=0.2' \
            'protobuf>=4.25,<7' 'numpy>=1.26,<3'
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-v5"
          git -C "$RUNNER_TEMP/llama-v5" checkout --quiet 970b51ce7c9ba5fff0726c5e9994f1c2f0e4eedc
          test -f "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py"
      - name: Download verified HF tokenizer/config only for source Qwen3-4B
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          root=Path(snapshot_download(repo_id='Qwen/Qwen3-4B',
            revision='3fb356690bbdae7353c94efb3eecdce276e6ed1c',
            allow_patterns=['config.json','generation_config.json',
              'tokenizer.json','tokenizer_config.json','special_tokens_map.json',
              'added_tokens.json','vocab.json','merges.txt','tokenizer.model',
              '*.tiktoken'],local_dir='/tmp/williams-v5-source-qwen3'))
          assert (root/'config.json').is_file()
          print('EXACT_QWEN3_4B_V5_TOKENIZER_READY_NO_RAW_PDF',flush=True)
          PY
      - name: Convert both independently SHA-verified adapters to GGUF LoRA
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py" \
            --base /tmp/williams-v5-source-qwen3 --outtype f16 \
            --outfile "$RUNNER_TEMP/williams-v5-new-adapter.gguf" \
            "$RUNNER_TEMP/williams_v5_private_runtime" \
            > "$RUNNER_TEMP/v5-conversion.log" 2>&1 || {
              grep -E '(Traceback|Error|error|ModuleNotFoundError|ImportError)' \
                "$RUNNER_TEMP/v5-conversion.log" | tail -n 10 || true
              exit 1
            }
          test -s "$RUNNER_TEMP/williams-v5-new-adapter.gguf"
          python "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py" \
            --base /tmp/williams-v5-source-qwen3 --outtype f16 \
            --outfile "$RUNNER_TEMP/williams-v6-new-adapter.gguf" \
            "$RUNNER_TEMP/williams_v6_private_runtime" \
            > "$RUNNER_TEMP/v6-conversion.log" 2>&1
          test -s "$RUNNER_TEMP/williams-v6-new-adapter.gguf"
      - name: Download SHA-pinned Qwen3-4B base GGUF for equal-conditions model exam
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          import os
          p=hf_hub_download(repo_id='unsloth/Qwen3-4B-GGUF',
            filename=os.environ['GGUF_FILE'],local_dir='/tmp/williams-v5-base')
          x=actual_gguf_sha256(p,os.environ['BASE_SHA256'])
          print('V5_SAME_ORIGINAL_QWEN_BASE_VERIFIED',x['model_sha256'],flush=True)
          PY
      - name: Same-prompt real BASE V5 V6 generation on held-out development cases
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          python - <<'PY'
          import gc, hashlib, json, os
          from pathlib import Path
          from llama_cpp import Llama
          from transformers import AutoTokenizer
          from scripts.ai_v6_objective_gpu_smoke import messages,grade,aggregate
          from williams_ai.v6_objective_practice import curriculum
          from scripts.ai_submit_v5_qlora_kaggle import _seal_data
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          secret=os.environ.pop("KAGGLE_API_TOKEN")
          root=Path(os.environ["RUNNER_TEMP"])
          out=root/"v6-recovered-comparison"
          out.mkdir(mode=0o700,exist_ok=False)
          base=Path("/tmp/williams-v5-base")/os.environ["GGUF_FILE"]
          actual_gguf_sha256(base,os.environ["BASE_SHA256"])
          tok=AutoTokenizer.from_pretrained("/tmp/williams-v5-source-qwen3",local_files_only=True,trust_remote_code=False)
          rows,manifest=curriculum()
          assert manifest["dataset_sha256"]=="2915c75df164b6531471bad56bae389762a04d428a3cfdf67867e5cd80c26c4b"
          dev=[r for r in rows if r["split"]=="development"]
          assert len(dev)==32
          result={}
          for name,lora in (("BASE",None),("V5",root/"williams-v5-new-adapter.gguf"),("A_V6",root/"williams-v6-new-adapter.gguf")):
              kwargs={"model_path":str(base),"n_ctx":1024,"n_gpu_layers":0,"verbose":False}
              if lora is not None:
                  assert lora.is_file() and lora.open("rb").read(4)==b"GGUF"
                  kwargs.update(lora_path=str(lora),lora_scale=1.0)
              model=Llama(**kwargs)
              records=[]
              for row in dev:
                  prompt=tok.apply_chat_template(messages(row),tokenize=False,add_generation_prompt=True,enable_thinking=False)
                  ids=tok.apply_chat_template(messages(row),tokenize=True,add_generation_prompt=True,enable_thinking=False)
                  assert model.tokenize(prompt.encode(),add_bos=False,special=True)==ids
                  completion=model.create_completion(prompt=ids,max_tokens=64,temperature=0.0,top_p=1.0,seed=20261124)
                  choice=completion["choices"][0]
                  raw=choice["text"]
                  records.append({"id":row["case_id"],"family":row["family"],"edition":row["edition"],"grade":grade(raw,row["answer"],choice["finish_reason"]=="length"),"raw":raw})
              result[name]=aggregate(records)
              result[name]["by_edition"]={ed:aggregate([r for r in records if r["edition"]==ed])["counts"] for ed in ("TC1","NTD","TC2","COURSE")}
              result[name]["gguf_adapter_sha256"]=hashlib.sha256(lora.read_bytes()).hexdigest() if lora else None
              (out/(name+".json.sealed")).write_bytes(_seal_data(json.dumps(records,ensure_ascii=False).encode(),secret))
              print("V6_REAL_DEVELOPMENT_COMPARISON",name,json.dumps(result[name],sort_keys=True),flush=True)
              model.close()
              del model
              gc.collect()
          report={"schema":"WILLIAMS_V6_RECOVERED_GGUF_DEV_COMPARISON_V1","results":result,"dataset":manifest,
              "base_gguf_sha256":os.environ["BASE_SHA256"],"original_v6_adapter_sha256":"f4979cf0bebbf33b7c8e5746326c1e43762f31fe730e89cf5e39c7a8a155c309",
              "max_new_tokens":64,"decoder":"greedy_llama_cpp_equal_conditions","closed_book":True,
              "independent_final_exam":False,"historical_chart_exam":False,"original_cuda_reload_equivalence_proven":False,
              "new_optimizer_steps":0,"execution_allowed":False,"qualified":False}
          (out/"aggregate.json").write_text(json.dumps(report,sort_keys=True,indent=2))
          PY
      - name: Preserve only numerical development report and encrypted responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v6-recovered-development-comparison
          path: |
            ${{ runner.temp }}/v6-recovered-comparison/*.sealed
            ${{ runner.temp }}/v6-recovered-comparison/aggregate.json
          if-no-files-found: warn
          retention-days: 21

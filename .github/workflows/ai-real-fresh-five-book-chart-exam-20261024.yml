name: Williams AI real Qwen study of five NEW Spot H1 book cases

on:
  push:
    branches:
      - feature/causal-wave-comprehension-stress-20261024

permissions:
  contents: read

jobs:
  actual-real-qwen-book-source-charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: /tmp/williams_new_book_hf
      GGUF_FILE: Qwen3-1.7B-Q4_K_M.gguf
      GGUF_SHA256: dbc27452971c440c0b94483fe6c101cf950ea50af6bcafe1282353c3886e6366
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify independent safety tests
        run: python -m unittest discover -s tests -p 'test_williams_ai_*.py' -q
      - name: Install pinned offline GGUF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python 'huggingface_hub>=0.29,<2'
      - name: Download REAL Qwen3 weights verified against exact published digest
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import os
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          p=Path(hf_hub_download(
              repo_id="unsloth/Qwen3-1.7B-GGUF",
              revision="b2d17796e6fd93c353a0415a3abd8b7f801701de",
              filename=os.environ["GGUF_FILE"],
              local_dir="/tmp/williams_fresh_book_weights",
          ))
          print("ACTUAL_GGUF_BYTES_VERIFIED",
                actual_gguf_sha256(p,os.environ["GGUF_SHA256"]))
          PY
      - name: Analyze five NEW current H1 charts and independently reject fabricated setups
        shell: bash
        run: |
          set -euo pipefail
          python -m williams_ai.fresh_real_book_chart_exam \
            --model "/tmp/williams_fresh_book_weights/${GGUF_FILE}" \
            --expected-sha256 "${GGUF_SHA256}" \
            --ctx 8192 | tee /tmp/williams_real_book_new_charts.log
      - name: Publish unedited actual model responses (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newly-captured-public-spot-h1-real-gguf-book-audit
          path: /tmp/williams_real_book_new_charts.log
          if-no-files-found: ignore
          retention-days: 7

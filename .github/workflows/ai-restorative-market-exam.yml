name: Williams AI frozen 30-case twenty-date market comparison
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['experiments/restorative-market-start.json']
permissions: {contents: read}
concurrency:
  group: williams-ai-restorative-market-20261028
  cancel-in-progress: false
jobs:
  four-real-models-no-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Verify twenty-date causal design and worker isolation
        run: python -m unittest discover -s tests -p 'test_williams_ai_spread_market.py' -v
      - name: Compare original and three own Qwen adapters on identical frozen prompts
        run: python scripts/ai_run_spread_market_kaggle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Williams_AI_FOUR_MODEL_30_H1_TWENTY_DATES
          path: ${{ runner.temp }}/spread_market_results/
          if-no-files-found: warn
          retention-days: 14

name: Williams AI V6 independent-expert exam intake (CPU-only)
on:
  push:
    branches: [research/williams-ai-curriculum-v5-20261111]
    paths:
      - 'williams_ai/independent_exam_v6.py'
      - 'tests/test_williams_ai_independent_exam_v6.py'
      - 'williams_ai/v6_expert_model_runner.py'
      - 'williams_ai/v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_real_market_smoke.py'
      - 'williams_ai/v6_v5_lora_binding.py'
      - 'williams_ai/v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_v5_lora_binding.py'
      - 'williams_ai/v6_history_context.py'
      - 'tests/test_williams_ai_v6_history_context.py'
      - 'williams_ai/v6_public_chart_collector.py'
      - 'williams_ai/v6_expert_review_packets.py'
      - 'tests/test_williams_ai_v6_expert_model_runner.py'
      - 'tests/test_williams_ai_v6_public_chart_collector.py'
      - 'tests/test_williams_ai_v6_expert_review_packets.py'
      - 'research/williams_v6_prospective_chart_plan_20261115_22.json'
      - 'research/williams_v6_full_forward_expert_plan_20261228_20270104.json'
      - '.github/workflows/ai-v6-expert-intake-cpu.yml'
  pull_request:
    paths:
      - 'williams_ai/independent_exam_v6.py'
      - 'tests/test_williams_ai_independent_exam_v6.py'
      - 'williams_ai/v6_expert_model_runner.py'
      - 'williams_ai/v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_real_market_smoke.py'
      - 'williams_ai/v6_v5_lora_binding.py'
      - 'williams_ai/v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_v5_lora_binding.py'
      - 'williams_ai/v6_history_context.py'
      - 'tests/test_williams_ai_v6_history_context.py'
      - 'williams_ai/v6_public_chart_collector.py'
      - 'williams_ai/v6_expert_review_packets.py'
      - 'tests/test_williams_ai_v6_expert_model_runner.py'
      - 'tests/test_williams_ai_v6_public_chart_collector.py'
      - 'tests/test_williams_ai_v6_expert_review_packets.py'
      - 'research/williams_v6_prospective_chart_plan_20261115_22.json'
      - 'research/williams_v6_full_forward_expert_plan_20261228_20270104.json'
      - '.github/workflows/ai-v6-expert-intake-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-v6-expert-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-expert-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signature-verification dependency (no GPU or secrets)
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
      - name: Compile static analysis
        run: |
          python -m py_compile williams_ai/independent_exam_v6.py tests/test_williams_ai_independent_exam_v6.py
          python -m py_compile williams_ai/v6_expert_model_runner.py williams_ai/v6_public_chart_collector.py williams_ai/v6_expert_review_packets.py williams_ai/v6_history_context.py williams_ai/v6_v5_lora_binding.py williams_ai/v6_real_market_smoke.py williams_ai/v6_real_market_smoke.py
          python -m py_compile tests/test_williams_ai_v6_expert_model_runner.py tests/test_williams_ai_v6_public_chart_collector.py tests/test_williams_ai_v6_expert_review_packets.py tests/test_williams_ai_v6_history_context.py tests/test_williams_ai_v6_v5_lora_binding.py tests/test_williams_ai_v6_real_market_smoke.py
      - name: Offline adversarial contract tests (synthetic fixtures only)
        run: |
          python -m unittest tests.test_williams_ai_independent_exam_v6 tests.test_williams_ai_v6_expert_model_runner tests.test_williams_ai_v6_public_chart_collector tests.test_williams_ai_v6_expert_review_packets tests.test_williams_ai_v6_history_context tests.test_williams_ai_v6_v5_lora_binding tests.test_williams_ai_v6_real_market_smoke -v

  real-public-market-smoke:
    # Deliberate one-off archival transport check, NEVER an expert holdout.
    # Triggered only by a commit message with the literal opt-in marker.
    if: ${{ github.event_name == 'push' && github.repository == '19wolfalone92/Williams-AI' && contains(github.event.head_commit.message, '[v6-live-smoke-20261112]') }}
    needs: offline-expert-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch REAL public 1024 H1 for BTC ETH SOL XRP (NO_KEYS, NON_HOLDOUT)
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_OFFLINE: '1'
        run: |
          python -m williams_ai.v6_real_market_smoke \
            --acknowledge-non-holdout \
            --out "$RUNNER_TEMP/WILLIAMS_V6_REAL_PUBLIC_NON_HOLDOUT_20261112.zip"
      - name: Upload verified public chart transport receipt, no labels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V6-REAL-PUBLIC-H1-H4-D1-NON-HOLDOUT-NOT-EXPERT
          path: ${{ runner.temp }}/WILLIAMS_V6_REAL_PUBLIC_NON_HOLDOUT_20261112.zip
          if-no-files-found: error
          retention-days: 21

  real-public-h1-smoke-on-explicit-research-commit:
    # Opt-in exactly once by adding tag to a research-branch commit message.
    # No model, reviewer gold, futures orders, API keys, GPU, or main writes.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-real-market-smoke]')
    needs: offline-expert-intake
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual public Binance USD-M closed historical candles
        run: |
          set -euo pipefail
          python -m williams_ai.v6_real_market_smoke \
            --acknowledge-non-holdout \
            --out "$RUNNER_TEMP/WILLIAMS_V6_PUBLIC_H1_NON_HOLDOUT.zip"
      - name: Archive non-holdout market evidence only
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V6-REAL-H1-1024x4-NON-HOLDOUT-NOT-GOLD
          path: ${{ runner.temp }}/WILLIAMS_V6_PUBLIC_H1_NON_HOLDOUT.zip
          if-no-files-found: error
          retention-days: 7

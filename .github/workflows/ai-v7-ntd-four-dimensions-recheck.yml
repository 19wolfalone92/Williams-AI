name: Williams AI v7 — NTD Alligator AO AC and Zone source rechecks
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - research/williams_v7_ntd_four_dimensions_recheck_20261115.json
      - williams_ai/v7_ntd_recheck_contract.py
      - tests/test_williams_ai_v7_ntd_recheck_contract.py
      - research/WILLIAMS_V7_RULE_CHECK_011_*
      - research/WILLIAMS_V7_RULE_CHECK_012_*
      - research/WILLIAMS_V7_RULE_CHECK_013_*
      - research/WILLIAMS_V7_RULE_CHECK_014_*
      - .github/workflows/ai-v7-ntd-four-dimensions-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-ntd-primary-rechecks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check SHA, pages, rule IDs and no labels
        run: |
          python -m unittest tests.test_williams_ai_v7_ntd_recheck_contract -v
          python -m williams_ai.v7_ntd_recheck_contract --input research/williams_v7_ntd_four_dimensions_recheck_20261115.json

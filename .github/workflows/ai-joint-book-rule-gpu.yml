name: Williams AI joint book history and arithmetic corrective GPU training
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['experiments/joint-rule-training-start.json']
permissions: {contents: read}
concurrency:
  group: williams-ai-private-joint-rules-20261106
  cancel-in-progress: false
jobs:
  actual-free-dual-t4-joint-corrective-training:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 265
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'numpy>=2,<3' 'safetensors==0.6.2' 'six>=1.16,<2'
      - name: Verify frozen split, independent keys and GPU worker contract
        run: python -m unittest discover -s tests -p 'test_williams_ai_joint_rule*.py' -v
      - name: Train actual Qwen3-4B on original books and corrective lessons
        run: python scripts/ai_run_joint_rule_kaggle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Williams_AI_Joint_Book_Rules_20261106_Research
          path: ${{ runner.temp }}/joint_rule_results/
          if-no-files-found: warn
          retention-days: 30

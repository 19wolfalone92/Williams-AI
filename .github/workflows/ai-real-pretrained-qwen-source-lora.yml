name: Williams AI real pretrained Qwen public-source LoRA first training

on:
  pull_request:
    paths:
      - 'scripts/ai_real_qwen_source_lora_start.py'
      - '.github/workflows/ai-real-pretrained-qwen-source-lora.yml'
      - 'williams_ai/lora_training.py'
      - 'williams_ai/private_lora.py'
      - 'knowledge/ADAPTIVE_TUTOR_PRACTICE_RU.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-real-source-lora-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-actual-pretrained-qwen-cpu-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU ML environment for genuine pretrained Qwen LoRA
        run: |
          python -m pip install --disable-pip-version-check torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r requirements-lora.txt 'huggingface_hub>=0.29,<2' 'jinja2>=3.1.6,<4'
      - name: Train official pretrained Qwen3-0.6B weights with PEFT LoRA and four-edition PUBLIC cases
        run: |
          python scripts/ai_real_qwen_source_lora_start.py \
            --new-output "$RUNNER_TEMP/williams-source-adapter" --steps 6
      - name: Publish research adapter and provenance, never original PDFs or private notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-06b-real-pretrained-lora-public-source-research-not-trading-ready
          path: |
            ${{ runner.temp }}/williams-source-adapter/adapter/adapter_model.safetensors
            ${{ runner.temp }}/williams-source-adapter/adapter/adapter_config.json
            ${{ runner.temp }}/williams-source-adapter/research_receipt.json
          if-no-files-found: warn
          retention-days: 7

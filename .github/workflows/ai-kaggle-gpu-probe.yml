name: Williams AI private Kaggle NVIDIA T4 GPU one-time connectivity probe

# One isolated push submission: private disposable worker, NO books/model/trades.
on:
  push:
    branches: [kaggle/private-gpu-probe-20261027]
    paths: ['.github/workflows/ai-kaggle-gpu-probe.yml']

permissions:
  contents: read

jobs:
  verify-private-gpu-availability:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official authenticated Kaggle CLI and account lookup
        run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Submit private GPU compute-only probe without datasets or secrets
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import time

          from kagglehub.auth import get_username

          if len(os.environ.get("KAGGLE_API_TOKEN","").strip()) < 16:
              raise RuntimeError("MISSING_KAGGLE_API_TOKEN_SECRET")
          username=get_username()
          if not isinstance(username,str) or re.fullmatch(r"[a-zA-Z0-9_-]{2,62}",username) is None:
              raise RuntimeError("KAGGLE_API_USER_AUTH_LOOKUP_FAILED")
          slug="williams-ai-gpu-after-phone-verification-20261027"
          kernel=f"{username}/{slug}"
          with tempfile.TemporaryDirectory(prefix="kaggle-gpu-only-") as tmp:
              output=Path(tmp)
              meta={
                  "id":kernel,"title":slug,"code_file":"worker.py",
                  "language":"python","kernel_type":"script",
                  "is_private":"true","enable_gpu":"true","enable_internet":"false",
                  "machine_shape":"NvidiaTeslaT4",
                  "dataset_sources":[],"model_sources":[],
                  "competition_sources":[],"kernel_sources":[]}
              (output/"kernel-metadata.json").write_text(json.dumps(meta),encoding="utf-8")
              (output/"worker.py").write_text(
                  "import torch, json\n"
                  "from pathlib import Path\n"
                  "if not torch.cuda.is_available():\n"
                  "    raise RuntimeError('CUDA_NOT_AVAILABLE_IN_KAGGLE_GPU_KERNEL')\n"
                  "x=torch.ones((256,),device='cuda')\n"
                  "assert x.sum().item()==256\n"
                  "receipt={'mode':'REAL_KAGGLE_GPU_ONLY_PROBE',"
                  "'torch_cuda_available':True,"
                  "'cuda_count':torch.cuda.device_count(),"
                  "'cuda_name':torch.cuda.get_device_name(0),"
                  "'real_4b_training_performed':False,"
                  "'licensed_book_data_uploaded':False,"
                  "'exchange_order_issued':False}\n"
                  "Path('/kaggle/working/gpu_probe_receipt.json').write_text(json.dumps(receipt))\n"
                  "print('GPU_PROBE_CUDA_TENSOR_SUCCESS')\n",
                  encoding="utf-8")
              push=subprocess.run(["kaggle","kernels","push","--path",str(output),
                      "--accelerator","NvidiaTeslaT4","--timeout","180"],
                      capture_output=True,text=True,timeout=160)
              if push.returncode:
                  print("PRIVATE_KAGGLE_GPU_PROBE_SUBMISSION: REJECTED_BY_KAGGLE")
                  print("GPU_SCHEDULE_OR_ACCOUNT_PERMISSION_MAY_BE_UNAVAILABLE")
                  sys.exit(5)
          print("PRIVATE_KAGGLE_GPU_PROBE_SUBMISSION: ACCEPTED")
          print(f"KAGGLE_PRIVATE_KERNEL_PAGE: https://www.kaggle.com/code/{kernel}")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## Private Kaggle GPU smoke test submitted\n\n"
                      f"[View your private Kaggle GPU notebook](https://www.kaggle.com/code/{kernel})\n\n"
                      "No book text, trading keys or user datasets were sent. "
                      "Kaggle GPU quota may be consumed briefly.\n")
          # Do not confuse Kaggle's successful API submission with a real CUDA
          # allocation: require an actual GPU receipt written by the worker.
          final_state="UNKNOWN"
          for _ in range(20):
              status=subprocess.run(["kaggle","kernels","status",kernel],
                  capture_output=True,text=True,timeout=35)
              state=status.stdout.lower()
              if status.returncode!=0:
                  print("KAGGLE_GPU_STATUS_QUERY_FAILED")
                  sys.exit(6)
              if "complete" in state or "finished" in state:
                  final_state="COMPLETE"
                  break
              if "error" in state or "failed" in state or "cancel" in state:
                  final_state="ERROR"
                  break
              time.sleep(10)
          print("KAGGLE_POST_VERIFICATION_EXECUTION_STATE:",final_state)
          if final_state!="COMPLETE":
              # Some Kaggle worker failures are invisible in GitHub Actions
              # unless explicitly treated as a failed run.
              print("KAGGLE_CUDA_NOT_VERIFIED_USER_ACCOUNT_OR_GPU_ALLOCATION")
              sys.exit(7)
          with tempfile.TemporaryDirectory(prefix="kaggle-probe-output-") as result_dir:
              got=subprocess.run(["kaggle","kernels","output",kernel,"-p",result_dir],
                  capture_output=True,text=True,timeout=90)
              if got.returncode:
                  print("KAGGLE_COMPLETED_NO_OUTPUT_RECEIPT")
                  sys.exit(8)
              receipt_path=Path(result_dir)/"gpu_probe_receipt.json"
              if not receipt_path.is_file():
                  print("KAGGLE_COMPLETED_BUT_CUDA_RECEIPT_NOT_FOUND")
                  sys.exit(9)
              receipt=json.loads(receipt_path.read_text(encoding="utf-8"))
              if (receipt.get("mode")!="REAL_KAGGLE_GPU_ONLY_PROBE"
                  or receipt.get("torch_cuda_available") is not True
                  or receipt.get("cuda_count",0)<1
                  or receipt.get("real_4b_training_performed") is not False
                  or receipt.get("licensed_book_data_uploaded") is not False):
                  print("KAGGLE_CUDA_RECEIPT_INVALID")
                  sys.exit(10)
              print("GPU_PROBE_ACTUAL_CUDA_SUCCESS")
              print("GPU_MODEL:",str(receipt.get("cuda_name","unknown"))[:80])
              print("GPU_COUNT:",receipt["cuda_count"])
          print("LICENSED_PRIVATE_BOOK_UPLOAD: NONE")
          print("QWEN_4B_TRAINING_PERFORMED: NO")
          PY

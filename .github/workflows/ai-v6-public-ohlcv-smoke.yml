name: Williams v6 REAL public OHLCV smoke (no secrets, no exam)
on:
  push:
    branches: [research/williams-ai-curriculum-v5-20261111]
    paths:
      - scripts/ai_v6_public_ohlcv_smoke.py
      - tests/test_ai_v6_public_ohlcv_smoke.py
      - williams_ai/v6_official_archive_collector.py
      - tests/test_williams_ai_v6_official_archive_collector.py
      - .github/workflows/ai-v6-public-ohlcv-smoke.yml
  pull_request:
    paths:
      - scripts/ai_v6_public_ohlcv_smoke.py
      - tests/test_ai_v6_public_ohlcv_smoke.py
      - williams_ai/v6_official_archive_collector.py
      - tests/test_williams_ai_v6_official_archive_collector.py
      - .github/workflows/ai-v6-public-ohlcv-smoke.yml
permissions:
  contents: read
concurrency:
  group: williams-v6-real-ohlcv-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-public-data-no-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and verify official-archive reader against offline adversarial fixtures
        run: |
          python -m py_compile scripts/ai_v6_public_ohlcv_smoke.py tests/test_ai_v6_public_ohlcv_smoke.py
          python -m unittest tests.test_ai_v6_public_ohlcv_smoke tests.test_williams_ai_v6_official_archive_collector -v
          python - <<'PY'
          from datetime import date
          from williams_ai.v6_official_archive_collector import verified_daily
          rows, receipt = verified_daily("BTCUSDT", date(2026, 11, 11))
          assert len(rows) == 24 and receipt["official_checksum_verified"] is True
          print("REAL_OFFICIAL_BINANCE_DAILY_ARCHIVE_VERIFIED", receipt["utc_date"], receipt["sha256"])
          PY
      - name: Verify official Binance USD-M daily archive checksum and 1h CSV schema
        run: |
          python - <<'PY'
          import csv,hashlib,io,re,zipfile
          from urllib.request import Request,urlopen
          base="https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1h/BTCUSDT-1h-2026-11-11.zip"
          def fetch(url):
              with urlopen(Request(url,headers={"User-Agent":"Williams-AI-v6-readonly"}),timeout=20) as r:
                  assert r.status==200
                  return r.read(2_000_000)
          checksum=fetch(base+".CHECKSUM").decode("ascii").strip()
          print("ARCHIVE_CHECKSUM_LINE",repr(checksum[:120]),flush=True)
          expected=checksum.split()[0]
          assert re.fullmatch(r"[0-9a-fA-F]{64}",expected)
          raw=fetch(base)
          assert hashlib.sha256(raw).hexdigest().lower()==expected.lower()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=z.namelist()
              assert len(names)==1 and names[0].endswith(".csv")
              records=list(csv.reader(io.StringIO(z.read(names[0]).decode("utf-8-sig"))))
              assert len(records) in (24,25)
              print("OFFICIAL_BINANCE_ARCHIVE_VERIFIED",
                    "zip_bytes="+str(len(raw)),
                    "csv_rows="+str(len(records)),
                    "first_column="+str(records[0][0]),
                    "last_column_count="+str(len(records[-1])),flush=True)
          PY
      - name: Fetch SHA-verified 1024 closed H1 candles from official monthly public archives
        run: |
          python -m scripts.ai_v6_public_ohlcv_smoke \
            --out "$RUNNER_TEMP/WILLIAMS_V6_REAL_PUBLIC_SMOKE_4SYMBOLS.json"
      - name: Verify non-trading research receipt only
        run: |
          python -c 'import json,os,pathlib; j=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"WILLIAMS_V6_REAL_PUBLIC_SMOKE_4SYMBOLS.json").read_text()); assert j["model_inference_performed"] is False and j["expert_gold_present"] is False and j["execution_allowed"] is False and len(j["market_data_result"])==4 and all(x["bars"]==1024 and x["D1_AO_available"] and x["D1_AC_available"] for x in j["market_data_result"])'
      - name: Upload read-only numeric market provenance (NO GOLD)
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v6-REAL-H1-H4-D1-SMOKE-NOT-EXAM
          path: ${{ runner.temp }}/WILLIAMS_V6_REAL_PUBLIC_SMOKE_4SYMBOLS.json
          if-no-files-found: error
          retention-days: 14
  actual-four-book-retrospective-comparison:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/williams-v5-research-hf
      TOKENIZERS_PARALLELISM: 'false'
      GGUF_FILE: Qwen3-4B-Q4_K_M.gguf
      BASE_SHA256: f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze rule-disjoint training, validation and independent test
        run: |
          python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48'
          python -m unittest tests.test_williams_ai_knowledge_curriculum_v5 tests.test_williams_ai_kaggle_v5 -v
          # Regression: recovery entrypoint must resolve sibling scripts as a package.
          python -c 'import importlib.util; assert importlib.util.find_spec("scripts.ai_recover_v5_qlora_kaggle") is not None; import scripts.ai_recover_v5_qlora_kaggle'
          python -m williams_ai.knowledge_curriculum_v5 \
            --database "$RUNNER_TEMP/williams-v5-train-dev-test.sqlite3" \
            --manifest "$RUNNER_TEMP/williams-v5-train-dev-test-manifest.json"
      - name: Install approved PRIVATE Kaggle submission client
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle==2.2.5' 'kagglehub>=0.3,<1' 'kagglesdk>=0.1' 'six>=1.16,<2' 'numpy>=2,<3'
      - name: Recover previously trained Kaggle Qwen3-4B LoRA without GPU work
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python -m scripts.ai_recover_v5_qlora_kaggle
      - name: Install local CPU GGUF LoRA converter (runner only)
        run: |
          python -m pip install --disable-pip-version-check --index-url \
            https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check \
            'huggingface_hub>=0.29,<2' 'transformers>=4.57,<5' \
            'gguf>=0.17' 'safetensors>=0.5' 'sentencepiece>=0.2' \
            'protobuf>=4.25,<7' 'numpy>=1.26,<3'
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-v5"
          git -C "$RUNNER_TEMP/llama-v5" checkout --quiet 970b51ce7c9ba5fff0726c5e9994f1c2f0e4eedc
          test -f "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py"
      - name: Download verified HF tokenizer/config only for source Qwen3-4B
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          root=Path(snapshot_download(repo_id='Qwen/Qwen3-4B',
            revision='3fb356690bbdae7353c94efb3eecdce276e6ed1c',
            allow_patterns=['config.json','generation_config.json',
              'tokenizer.json','tokenizer_config.json','special_tokens_map.json',
              'added_tokens.json','vocab.json','merges.txt','tokenizer.model',
              '*.tiktoken'],local_dir='/tmp/williams-v5-source-qwen3'))
          assert (root/'config.json').is_file()
          print('EXACT_QWEN3_4B_V5_TOKENIZER_READY_NO_RAW_PDF',flush=True)
          PY
      - name: Convert independently SHA-verified V5 adapter to real GGUF LoRA
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py" \
            --base /tmp/williams-v5-source-qwen3 --outtype f16 \
            --outfile "$RUNNER_TEMP/williams-v5-new-adapter.gguf" \
            "$RUNNER_TEMP/williams_v5_private_runtime" \
            > "$RUNNER_TEMP/v5-conversion.log" 2>&1 || {
              grep -E '(Traceback|Error|error|ModuleNotFoundError|ImportError)' \
                "$RUNNER_TEMP/v5-conversion.log" | tail -n 10 || true
              exit 1
            }
          test -s "$RUNNER_TEMP/williams-v5-new-adapter.gguf"
      - name: Download SHA-pinned Qwen3-4B base GGUF for equal-conditions model exam
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          import os
          p=hf_hub_download(repo_id='unsloth/Qwen3-4B-GGUF',
            filename=os.environ['GGUF_FILE'],local_dir='/tmp/williams-v5-base')
          x=actual_gguf_sha256(p,os.environ['BASE_SHA256'])
          print('V5_SAME_ORIGINAL_QWEN_BASE_VERIFIED',x['model_sha256'],flush=True)
          PY
      - name: Run ACTUAL four-book historical H1 base-vs-trained v5 on CPU (no expert gold)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu \
            llama-cpp-python
          python -m scripts.ai_v6_real_market_4book_cpu_smoke \
            --base-gguf "/tmp/williams-v5-base/${GGUF_FILE}" \
            --trained-lora-gguf "$RUNNER_TEMP/williams-v5-new-adapter.gguf" \
            --training-receipt "$RUNNER_TEMP/williams_v5_private_runtime/training_receipt.json" \
            --out "$RUNNER_TEMP/williams_v6_real_market_4book_technical_smoke.json"
      - name: Reject any trading or false expert exam claims
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"williams_v6_real_market_4book_technical_smoke.json"
          x=json.loads(p.read_text())
          assert x["schema"]=="WILLIAMS_V6_IMMEDIATE_REAL_RETRO_4BOOK_CPU_SMOKE_V1"
          assert x["no_expert_labels"] is True and x["real_market_book_accuracy"] is None
          assert x["research_execution_allowed"] is False
          assert x["gpu_training_allowed"] is False
          assert x["no_live_broker_trading"] is True
          assert set(x["observed"])=={"matched_base","candidate_v5"}
          for role in ("matched_base","candidate_v5"):
              rows=x["observed"][role]
              assert len(rows)==4 and {r["edition"] for r in rows}=={"TC1","NTD","TC2","COURSE"}
              assert all(r["finish_reason"] in ("stop","length","error") for r in rows)
          print("ACTUAL_CPU_BASE_AND_V5_FOUR_BOOK_MARKET_SMOKE_COMPLETE_NO_GOLD",flush=True)
          PY
      - name: Upload ONLY technical 4-book answer summaries, no weights or expert gold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v6-ACTUAL-Qwen-4book-RETROSPECTIVE-CPU-NO-EXPERT-GOLD
          path: ${{ runner.temp }}/williams_v6_real_market_4book_technical_smoke.json
          if-no-files-found: warn
          retention-days: 14

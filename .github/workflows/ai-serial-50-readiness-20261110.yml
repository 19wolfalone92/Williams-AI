name: Williams AI 50 micro-cycle private Kaggle dry-run (no GPU)
on:
  push:
    branches: [research/fifty-serial-mini-cycles-20261110]
    paths: ['experiments/serial-50-dry-run.json']
permissions: {contents: read}
concurrency:
  group: williams-ai-serial-50-private-upload-readiness
  cancel-in-progress: false
jobs:
  preflight-private-archive-without-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WILLIAMS_GPU_DRY_RUN: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'numpy>=2,<3' 'safetensors==0.6.2' 'six>=1.16,<2'
      - name: Verify quota, exact previous adapter, frozen private books and kernel payload size
        run: python scripts/ai_run_serial_50_kaggle.py

name: Williams AI Kaggle secure credential read-only check

# Narrow, deliberate push event to validate a newly added secret once.
# No model training, datasets, private books, Kaggle writes, or GPU usage.
on:
  push:
    branches:
      - kaggle/auth-check-20261027
    paths:
      - '.github/workflows/ai-kaggle-credential-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-kaggle-auth:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Kaggle CLI
        run: python -m pip install --disable-pip-version-check 'kaggle>=1.7.0,<2'
      - name: Read-only Kaggle authentication; NEVER print the token or username
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          token = os.environ.get("KAGGLE_API_TOKEN", "")
          if len(token.strip()) < 16:
              print("KAGGLE_CREDENTIAL_CHECK: MISSING_OR_EMPTY_GITHUB_ACTIONS_SECRET")
              sys.exit(1)
          # Kaggle CLI officially supports KAGGLE_API_TOKEN. This read-only
          # authenticated call MUST succeed before any GPU/data preparation.
          try:
              check = subprocess.run(
                  ["kaggle", "kernels", "list", "--mine", "--page-size", "1"],
                  stdin=subprocess.DEVNULL, capture_output=True,
                  text=True, timeout=70, check=False)
          except (subprocess.TimeoutExpired, FileNotFoundError):
              print("KAGGLE_CREDENTIAL_CHECK: API_UNAVAILABLE_OR_CLI_UNAVAILABLE")
              sys.exit(2)
          if check.returncode != 0:
              # Some CLI errors contain identifying information; NEVER
              # print stdout/stderr here.
              print("KAGGLE_CREDENTIAL_CHECK: TOKEN_REJECTED_OR_API_UNAVAILABLE")
              sys.exit(3)
          print("KAGGLE_CREDENTIAL_CHECK: SUCCESS_AUTHENTICATED_READ_ONLY")
          print("GPU_USED: NO")
          print("ORIGINAL_BOOK_PDF_SENT_TO_CLOUD: NO")
          print("KAGGLE_KERNEL_CREATED: NO")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write("## Kaggle API authorization confirmed ✅\n\n"
                      "Authenticated read-only `kaggle kernels list --mine`. "
                      "**No datasets, books, model weights, orders, Kaggle "
                      "notebooks or GPU sessions were created.**\n")
          PY

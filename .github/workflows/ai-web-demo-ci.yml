name: Williams AI research and DEMO safety

on:
  push:
    branches: [feature/web-search-demo-futures, feature/book-grounded-chart-reader]
  pull_request:
    paths:
      - "williams_ai/**"
      - "tests/test_williams_ai_*.py"
      - "mobile/**"
      - "knowledge/**"
      - "examples/ai_chart_example.json"
      - ".github/workflows/ai-web-demo-ci.yml"

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: All AI tests (no demo keys, no outbound requests)
        run: python -m unittest discover -s tests -p "test_williams_ai_*.py" -v
      - name: Compile Python
        run: python -m compileall -q williams_ai
      - name: Verify no book extracts committed
        run: |
          test -z "$(find knowledge williams_ai -type f \( -name '*.pdf' -o -name '*.sqlite3' -o -name '*.db' \))"
      - name: CLI offline smoke
        run: |
          python -m williams_ai.cli examples/ai_market_snapshot.json
          python -m williams_ai.chart_cli examples/ai_chart_example.json > /tmp/chart-evidence.json
          python -m williams_ai.book_cli --db /tmp/empty_williams.db report
      - name: Frozen 15-pair walk-forward evaluation (no internet, no trades)
        run: |
          python - <<'PY'
          from williams_ai.causal_paper_lab import run_15
          report=run_15()
          print("AGGREGATE",report["aggregate"])
          print("WM3_BENCHMARK_PER_PAIR: SYMBOL CLOSED WINS REALIZED_PCT BUY_HOLD_PCT OPEN")
          for x in report["results"]:
              if x["mode"]=="WM3":
                  print(x["symbol"],x["closed"],x["wins"],x["realized_return_pct"],x["benchmark_buy_and_hold_pct"],bool(x["open_position"]))
          PY

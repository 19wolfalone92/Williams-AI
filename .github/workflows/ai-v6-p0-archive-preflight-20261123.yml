name: Williams AI v6 P0 Binance archive provenance and research regression (NO GPU)
on:
  push:
    branches: [research/v6-binance-p0-audit-20261123]
    paths:
      - 'williams_ai/v6_official_archive_collector.py'
      - 'williams_ai/v6_public_binance_archive.py'
      - 'williams_ai/v6_v5_lora_binding.py'
      - 'scripts/ai_v6_official_archives_preflight.py'
      - 'tests/test_williams_ai_v6_official_archive_collector.py'
      - 'tests/test_williams_ai_v6_public_binance_archive.py'
      - 'tests/test_williams_ai_v6_official_archives_preflight.py'
      - 'tests/test_williams_ai_v6_v5_lora_binding.py'
      - '.github/workflows/ai-v6-p0-archive-preflight-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: williams-v6-p0-archive-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and archive / 1024-H1 / LoRA binding regressions
        run: |
          python -m py_compile williams_ai/v6_official_archive_collector.py williams_ai/v6_public_binance_archive.py williams_ai/v6_v5_lora_binding.py scripts/ai_v6_official_archives_preflight.py
          python -m pip install --disable-pip-version-check 'cryptography>=44,<48'
          python -m unittest tests.test_williams_ai_v6_official_archive_collector tests.test_williams_ai_v6_public_binance_archive tests.test_williams_ai_v6_official_archives_preflight tests.test_williams_ai_v6_v5_lora_binding tests.test_williams_ai_v6_public_chart_collector tests.test_williams_ai_v6_history_context -v
      - name: Broader Williams AI research regression (no GPU)
        run: python -m unittest discover -s tests -p 'test_williams_ai_*.py' -q

  source-integrity:
    needs: offline-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe 200 official daily public ZIP + sha256 and 32 closed-H1 windows
        run: |
          python -m scripts.ai_v6_official_archives_preflight \
            --plan research/williams_v6_prospective_chart_plan_20261115_22.json \
            --out "${{ runner.temp }}/williams_v6_200_archives_provenance.json" --probe
      - name: Upload P0 forensic source receipts, NOT chart gold or training data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V6-200-Official-Daily-Archive-Source-Receipts-NO-TRAINING
          path: ${{ runner.temp }}/williams_v6_200_archives_provenance.json
          if-no-files-found: warn
          retention-days: 21

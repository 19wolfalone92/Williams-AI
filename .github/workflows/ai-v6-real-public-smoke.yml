name: Williams AI v6 LIVE public market transport smoke — NOT expert exam
on:
  push:
    branches: [research/williams-ai-curriculum-v5-20261111]
    paths:
      - '.github/workflows/ai-v6-real-public-smoke.yml'
      - 'williams_ai/v6_real_market_smoke.py'
      - 'tests/test_williams_ai_v6_real_market_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-v6-real-market-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-historical-public-ohlcv:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python code and mock-only contracts; no API keys
        run: |
          python -m py_compile williams_ai/v6_real_market_smoke.py
          python -m unittest tests.test_williams_ai_v6_real_market_smoke -v
      - name: Fetch and verify real historical PUBLIC Binance USD-M H1 candles
        env:
          PYTHONNOUSERSITE: '1'
          HF_HUB_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: |
          python -m williams_ai.v6_real_market_smoke \
            --acknowledge-non-holdout \
            --out "$RUNNER_TEMP/WILLIAMS_V6_REAL_PUBLIC_4_SYMBOL_NON_HOLDOUT_SMOKE.zip"
      - name: Archive VERIFIED public market snapshots, NOT exam gold
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-V6-REAL-PUBLIC-4-SYMBOL-H1-H4-D1-NON-HOLDOUT-NOT-GOLD
          path: ${{ runner.temp }}/WILLIAMS_V6_REAL_PUBLIC_4_SYMBOL_NON_HOLDOUT_SMOKE.zip
          if-no-files-found: error
          retention-days: 21

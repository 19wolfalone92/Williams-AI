name: Williams AI fresh objective baseline diagnostic (one shot, no training)
on:
  push:
    branches: [research/v5-recovery-integrity-20261124]
    paths: ['.github/workflows/ai-v5-objective-diagnostic-20261124.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: williams-v5-objective-diagnostic-20261124
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/williams-v5-research-hf
      TOKENIZERS_PARALLELISM: 'false'
      GGUF_FILE: Qwen3-4B-Q4_K_M.gguf
      BASE_SHA256: f6f851777709861056efcdad3af01da38b31223a3ba26e61a4f8bf3a2195813a
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check diagnostic contracts
        run: |
          python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48'
          python -m unittest discover -s tests -p test_williams_ai_v5_objective_diagnostic.py -v
      - name: Download already strictly verified encrypted adapter (no Kaggle submission)
        uses: actions/download-artifact@v4
        with:
          name: Williams-v5-strict-recovery-45406594397-1
          run-id: 45406594397
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-sealed-input
      - name: Authenticate sealed input in private runner memory
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python - <<'PY'
          import io,json,os
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from scripts.ai_submit_v5_qlora_kaggle import DOMAIN
          from scripts.v5_recovery_integrity import verify_recovered_identity
          root=Path(os.environ["RUNNER_TEMP"])
          source=root/"verified-sealed-input"
          sealed,=source.rglob("williams-v5-trained-qwen3-4b-lora.zip.sealed")
          audit,=source.rglob("v5_training_audit.json")
          data=sealed.read_bytes()
          assert sha256(data).hexdigest()==json.loads(audit.read_text())["sha256_encrypted_archive"]
          prefix=b"WILLIAMSV5A1"
          assert data.startswith(prefix)
          offset=len(prefix)
          key=HKDF(algorithm=hashes.SHA256(),length=32,
            salt=data[offset:offset+16],info=DOMAIN).derive(os.environ["KAGGLE_API_TOKEN"].encode())
          clear=AESGCM(key).decrypt(data[offset+16:offset+28],data[offset+28:],DOMAIN)
          dest=root/"williams_v5_private_runtime"
          dest.mkdir(mode=0o700,exist_ok=False)
          with ZipFile(io.BytesIO(clear)) as archive:
              names=("training_receipt.json","adapter_model.safetensors","adapter_config.json")
              for name in names:
                  path=dest/name
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
                  with os.fdopen(fd,"wb") as stream: stream.write(archive.read(name))
          print("REUSED_STRICT_ADAPTER",json.dumps(verify_recovered_identity(*(dest/n for n in names))),flush=True)
          PY
      - name: Install local CPU GGUF LoRA converter (runner only)
        run: |
          python -m pip install --disable-pip-version-check --index-url \
            https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install --disable-pip-version-check \
            'huggingface_hub>=0.29,<2' 'transformers>=4.57,<5' \
            'gguf>=0.17' 'safetensors>=0.5' 'sentencepiece>=0.2' \
            'protobuf>=4.25,<7' 'numpy>=1.26,<3'
          git clone --quiet --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama-v5"
          git -C "$RUNNER_TEMP/llama-v5" checkout --quiet 970b51ce7c9ba5fff0726c5e9994f1c2f0e4eedc
          test -f "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py"
      - name: Download verified HF tokenizer/config only for source Qwen3-4B
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          root=Path(snapshot_download(repo_id='Qwen/Qwen3-4B',
            revision='3fb356690bbdae7353c94efb3eecdce276e6ed1c',
            allow_patterns=['config.json','generation_config.json',
              'tokenizer.json','tokenizer_config.json','special_tokens_map.json',
              'added_tokens.json','vocab.json','merges.txt','tokenizer.model',
              '*.tiktoken'],local_dir='/tmp/williams-v5-source-qwen3'))
          assert (root/'config.json').is_file()
          print('EXACT_QWEN3_4B_V5_TOKENIZER_READY_NO_RAW_PDF',flush=True)
          PY
      - name: Convert independently SHA-verified V5 adapter to real GGUF LoRA
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/llama-v5/convert_lora_to_gguf.py" \
            --base /tmp/williams-v5-source-qwen3 --outtype f16 \
            --outfile "$RUNNER_TEMP/williams-v5-new-adapter.gguf" \
            "$RUNNER_TEMP/williams_v5_private_runtime" \
            > "$RUNNER_TEMP/v5-conversion.log" 2>&1 || {
              grep -E '(Traceback|Error|error|ModuleNotFoundError|ImportError)' \
                "$RUNNER_TEMP/v5-conversion.log" | tail -n 10 || true
              exit 1
            }
          test -s "$RUNNER_TEMP/williams-v5-new-adapter.gguf"
      - name: Download SHA-pinned Qwen3-4B base GGUF for equal-conditions model exam
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from williams_ai.real_gguf_acceptance import actual_gguf_sha256
          import os
          p=hf_hub_download(repo_id='unsloth/Qwen3-4B-GGUF',
            filename=os.environ['GGUF_FILE'],local_dir='/tmp/williams-v5-base')
          x=actual_gguf_sha256(p,os.environ['BASE_SHA256'])
          print('V5_SAME_ORIGINAL_QWEN_BASE_VERIFIED',x['model_sha256'],flush=True)
          PY
      - name: Real Qwen3-4B versus trained v5 closed and open-book inference
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu llama-cpp-python
          python -m williams_ai.v5_objective_diagnostic \
            --base "/tmp/williams-v5-base/${GGUF_FILE}" \
            --adapter "$RUNNER_TEMP/williams-v5-new-adapter.gguf" \
            --receipt "$RUNNER_TEMP/williams_v5_private_runtime/training_receipt.json" \
            --output "$RUNNER_TEMP/v5-objective-diagnostic"
      - name: Archive encrypted original answers and numerical diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Williams-v5-objective-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v5-objective-diagnostic/*.sealed
            ${{ runner.temp }}/v5-objective-diagnostic/aggregate.json
          if-no-files-found: warn
          retention-days: 21

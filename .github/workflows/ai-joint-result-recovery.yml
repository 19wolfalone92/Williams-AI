name: Williams AI independent audit of existing corrective GPU run
# Exact fsum audit of completed weights; no retraining or score repair.
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['.github/workflows/ai-joint-result-recovery.yml']
permissions: {contents: read}
concurrency:
  group: williams-ai-joint-result-audit-20261106
  cancel-in-progress: false
jobs:
  observe-and-verify-existing-run-no-gpu-submission:
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48' 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1' 'numpy>=2,<3' 'safetensors==0.6.2' 'six>=1.16,<2'
      - name: Recalculate frozen keys and selection invariants
        run: python -m unittest discover -s tests -p 'test_williams_ai_joint_rule*.py' -v
      - name: Read and verify only the existing source-pinned run
        run: python scripts/ai_recover_joint_rule_result.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Williams_AI_Joint_Rules_20261106_Independent_Audit
          path: ${{ runner.temp }}/joint_rule_recovered_results/
          if-no-files-found: warn
          retention-days: 30

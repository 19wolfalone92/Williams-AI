name: Williams AI v7 — primary-source AO Lips W4 numeric verification (NO weights)
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - test_williams_v7_source_arithmetic.py
      - williams_ai/wave_evidence.py
      - tests/test_williams_ai_wave_evidence.py
      - williams_ai/v7_blind_review_pack.py
      - tests/test_williams_ai_v7_blind_review_pack.py
      - .github/workflows/ai-v7-source-arithmetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-numeric-causal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies for actual strategy calculations
        run: python -m pip install --quiet --disable-pip-version-check 'numpy==2.1.3' 'pandas==2.2.3'
      - name: Verify AO median, Lips SMMA +3, AC, historical causality and wave zero crossing
        run: |
          python -m unittest test_williams_v7_source_arithmetic -v
          python -m unittest tests.test_williams_ai_wave_evidence tests.test_williams_ai_v7_blind_review_pack -v

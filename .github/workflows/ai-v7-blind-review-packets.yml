name: Williams AI v7 — independent blind reviewer packet contract (NO GPU/LoRA)
on:
  push:
    branches: [research/williams-v6-post-hist100-evidence-20261115]
    paths:
      - williams_ai/v7_blind_review_pack.py
      - tests/test_williams_ai_v7_blind_review_pack.py
      - research/WILLIAMS_V7_SOURCE_CONFLICTS_20261117.json
      - .github/workflows/ai-v7-blind-review-packets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-packet-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify blinded 30-case review packet integrity, no approval or SFT
        run: python -m unittest tests.test_williams_ai_v7_blind_review_pack -v

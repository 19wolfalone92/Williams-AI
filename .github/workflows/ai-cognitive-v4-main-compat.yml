name: Williams AI cognitive v4 main compatibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'williams_ai/**'
      - 'tests/test_williams_ai_*.py'
      - '.github/workflows/ai-cognitive-v4-main-compat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'williams_ai/cognitive_memory_v4.py'
      - 'williams_ai/cognitive_market_bridge_v4.py'
      - 'williams_ai/cognitive_timeframe_coherence_v5.py'
      - 'tests/test_williams_ai_cognitive_market_v4.py'
      - 'tests/test_williams_ai_cognitive_source_v4.py'
      - 'williams_ai/grounded_inference.py'
      - 'williams_ai/local_model.py'
      - 'williams_ai/cognitive_engine_v4.py'
      - 'williams_ai/unified_memory.py'
      - 'williams_ai/unified_ai.py'
      - 'williams_ai/adaptive_coach.py'
      - 'williams_ai/study.py'
      - 'williams_ai/reasoning_trial.py'
      - 'williams_ai/deliberate_learning.py'
      - 'tests/test_williams_ai_unified_runtime.py'
      - 'tests/test_williams_ai_cognitive_v4.py'
      - 'tests/test_williams_ai_cognitive_root_causality_v4.py'
      - '.github/workflows/ai-cognitive-v4-main-compat.yml'
permissions:
  contents: read
concurrency:
  group: williams-cognitive-v4-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cognitive-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static syntax and import contract
        run: |
          python -m py_compile williams_ai/cognitive_timeframe_coherence_v5.py tests/test_williams_ai_cognitive_source_v4.py williams_ai/grounded_inference.py williams_ai/local_model.py williams_ai/cognitive_market_bridge_v4.py tests/test_williams_ai_cognitive_market_v4.py williams_ai/cognitive_memory_v4.py williams_ai/cognitive_engine_v4.py williams_ai/unified_memory.py williams_ai/unified_ai.py williams_ai/adaptive_coach.py williams_ai/study.py williams_ai/reasoning_trial.py
          python -m williams_ai.unified_ai --help
      - name: Deep causal and semantic recall tests
        run: python -m unittest tests.test_williams_ai_cognitive_source_v4 tests.test_williams_ai_cognitive_market_v4 tests.test_williams_ai_cognitive_v4 tests.test_williams_ai_cognitive_root_causality_v4 tests.test_williams_ai_unified_runtime tests.test_williams_ai_adaptive_coach -v
      - name: Full pre-existing Williams AI contract regression
        run: python -m unittest discover -s tests -p 'test_williams_ai_*.py' -q
      - name: No licensed books or trade execution in integration diff
        run: |
          python - <<'PY'
          import subprocess
          import os
          event=os.environ.get("GITHUB_EVENT_NAME")
          base=['HEAD^','HEAD'] if event=='push' else ['origin/main...HEAD']
          paths=subprocess.check_output(['git','diff','--name-only']+
              base,text=True).splitlines()
          print('PRIVACY_DIFF_EVENT',event,'PATH_COUNT',len(paths))
          forbidden=('.pdf','.zip','.sqlite','.sqlite3','.gguf','.safetensors','.key')
          bad=[x for x in paths if x.lower().endswith(forbidden)]
          if bad: raise SystemExit('PRIVATE_USER_ASSET_IN_PUBLIC_BRANCH:'+str(bad))
          print('NO_PRIVATE_BOOK_OR_MODEL_BLOBS_IN_COGNITIVE_V4_COMMIT')
          PY

name: Williams AI private originals deep Qwen3-4B training and blind exam

on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths:
      - '.github/workflows/ai-private-four-book-deep-training.yml'
      - 'experiments/private-source-20261027.sealed.json'

permissions:
  contents: read

concurrency:
  group: williams-private-four-book-20261027
  cancel-in-progress: false

jobs:
  private-source-only-research:
    if: github.repository == '19wolfalone92/Williams-AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'cryptography>=44,<48'
      - name: Verify authenticated private transport without any original text
        run: python -m unittest discover -s tests -p 'test_williams_ai_sealed_source_transport.py' -v
      - name: Publish encryption PUBLIC key only; secret stays on this runner
        run: python scripts/ai_sealed_source_transport.py public-key
      - name: Verify frozen data, independent prediction sealing and bounded research
        if: hashFiles('experiments/private-source-20261027.sealed.json') != ''
        run: python -m unittest discover -s tests -p 'test_williams_ai_deep_book_research.py' -v
      - name: Install official private Kaggle client
        if: hashFiles('experiments/private-source-20261027.sealed.json') != ''
        run: python -m pip install --quiet --disable-pip-version-check 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Train actual Qwen3-4B on private originals and practice; seal 30 market predictions
        if: hashFiles('experiments/private-source-20261027.sealed.json') != ''
        run: python scripts/ai_run_private_deep_kaggle.py
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('experiments/private-source-20261027.sealed.json') != ''
        with:
          name: Williams_AI_Qwen3_4B_PRIVATE_ORIGINALS_DEEP_RESEARCH
          path: ${{ runner.temp }}/private_deep_results/
          if-no-files-found: warn
          retention-days: 14

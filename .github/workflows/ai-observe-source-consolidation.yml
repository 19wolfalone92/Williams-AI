name: Williams AI read-only frozen five-model progress
on:
  push:
    branches: [research/private-four-book-deep-training-20261027]
    paths: ['.github/workflows/ai-observe-source-consolidation.yml']
permissions: {contents: read}
jobs:
  observe-only-existing-source-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      WILLIAMS_OBSERVE_SLUG: williams-ai-source-final-5models-20261028
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet --disable-pip-version-check 'kaggle>=1.7.0,<2' 'kagglehub>=0.3.0,<1'
      - name: Read only existing source trainer and free GPU quota
        run: python scripts/ai_observe_own_training.py
